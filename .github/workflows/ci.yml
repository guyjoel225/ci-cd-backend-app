name: nodejs test app

run-name: test app

on:
  push:
    branches:
      - main


jobs:

  test:
    
    name: configurer et tester une app node js

    runs-on: ubuntu-latest

    steps:
      
      - name: afficher un message
        run: echo "Bonjour, un test de focntionnement"

      - name: réccuperation du depot
        uses: actions/checkout@v4

      - name: configuration de l'environement node js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: installer les dépendances
        run: npm ci

      - name: tester les types
        run: npm run typecheck

      - name: tester le bon fonctionnement du code 
        run: npm run test